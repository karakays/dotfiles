onboarding = false

[keys]
prefix = "ctrl+b"
workspace_picker = "prefix+w"
goto = "prefix+g"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
detach = "prefix+shift+d"
close_workspace = "prefix+shift+q"
settings = "prefix+shift+s"
reload_config = "prefix+r"
open_notification_target = "prefix+shift+o"
copy_mode = "prefix+space"
last_pane = "prefix+minus"
split_horizontal = "prefix+s"
resize_mode = "prefix+shift+r"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-bar.open"
description = "Open command bar"

[[keys.command]]
key = "prefix+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "Review uncommitted changes in Hunk"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:branch"
description = "Review current branch against its base in Hunk"

[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "Send Hunk review to agent"

[ui]
agent_panel_sort = "priority"
sidebar_collapsed_mode = "hidden"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[theme]
name = "terminal"
auto_switch = false

[advanced]
scrollback_limit_bytes = 250000000
